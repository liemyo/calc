<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* phones + small tablets: whole app at 88% (layout widens to fill the screen); max-scale stops iOS zooming into inputs */
if (Math.min(screen.width, screen.height) <= 820) document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=0.88, minimum-scale=0.88, maximum-scale=0.88, viewport-fit=cover';</script>
<title>Calc</title>
<meta name="description" content="Calc: kalkulator scientific online + hitung luas (m²) dan volume (m³) konstruksi — kolom, balok, plat, U-Ditch, box culvert, buis, tabung, galian — simpan, beri nama, dan sinkron real time di HP dan laptop.">
<meta name="theme-color" content="#e8590c">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23e8590c'/><rect x='24' y='18' width='52' height='20' rx='5' fill='white'/><g fill='white'><circle cx='32' cy='54' r='6'/><circle cx='50' cy='54' r='6'/><circle cx='68' cy='54' r='6'/><circle cx='32' cy='72' r='6'/><circle cx='50' cy='72' r='6'/><circle cx='68' cy='72' r='6'/></g></svg>">
<style>:root{--bg:#f5f4f1;--card:#fff;--soft:#efede8;--line:#e2dfd8;--text:#1b1a17;--muted:#6d6a63;--acc:#e8590c;--acc-ink:#fff;--key:#f3f2ee;--key2:#e7e5df;--op:#fde9dc;--op-ink:#c2410c;--ok:#1f9d55;--red:#d6383e;--shadow:0 1px 2px rgba(40,30,10,.05),0 4px 14px rgba(40,30,10,.05);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121110;--card:#1c1b19;--soft:#262421;--line:#33302c;--text:#f2efe9;--muted:#a39e95;--acc:#ff8a3d;--acc-ink:#1b0e04;--key:#25231f;--key2:#2e2b27;--op:#3a2416;--op-ink:#ffae74;--ok:#4ad08a;--red:#ff6b70;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0;color:var(--text)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
a{color:inherit}
h1,h2{letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;cursor:pointer;font-weight:600;text-align:center;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.xs{padding:2px 8px;font-size:12px;border-radius:8px}
.muted{color:var(--muted)}.small{font-size:13px}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.empty{padding:14px 4px;margin:0}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{padding:10px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;text-decoration:none;flex:none}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a3d,#d9480f);color:#fff;font-size:18px;font-weight:800}
.tabs{display:flex;gap:4px;flex:1;justify-content:center}
.tab{border:0;background:none;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab:hover{background:var(--soft)}
.tab.on{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.top-r{display:flex;align-items:center;gap:10px;flex:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.bnav{display:none}
.main{padding:20px 24px 60px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{margin:0;font-size:24px}
.head-r{display:flex;gap:8px;flex:1;justify-content:flex-end;min-width:260px}
.head-r input{flex:1;max-width:420px}
/* calculator */
.main.v-calc{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);gap:18px;align-items:start}
.calc{padding:16px}
.screen{background:var(--soft);border-radius:14px;padding:10px 14px 6px;margin-bottom:14px}
.scr-top{display:flex;gap:6px;align-items:center;min-height:22px}
.ind{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:6px;padding:1px 6px}
.ind[hidden]{display:none}
.preview{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%;font-variant-numeric:tabular-nums}
.preview.err{color:var(--red)}
.disp{width:100%;border:0!important;outline:0!important;background:none;text-align:right;font-size:40px;font-weight:600;padding:2px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;caret-color:var(--acc)}
.pads{display:grid;grid-template-columns:6fr 4fr;gap:14px}
.sci{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;align-content:start}
.basic{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.key{border:0;border-radius:12px;background:var(--key);cursor:pointer;font-weight:600;font-size:15px;height:52px;padding:0 2px;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .05s,filter .1s}
.key:hover{filter:brightness(.96)}
:root[data-theme=dark] .key:hover{filter:brightness(1.15)}
.key:active{transform:scale(.95)}
.key.sk{background:var(--key2);font-size:14px;height:47px}
.key.alt{color:var(--acc)}
.key.on{background:var(--acc);color:var(--acc-ink)}
.key.dig{background:var(--card);border:1px solid var(--line);font-size:21px;height:56px}
.basic .key{height:56px;font-size:19px}
.key.op{background:var(--op);color:var(--op-ink);font-size:22px}
.key.fn{color:var(--red)}
.key.eq{background:var(--acc);color:var(--acc-ink);font-size:24px}
/* history */
.hist{padding:14px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 110px);position:sticky;top:76px}
.h-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.h-head h2{margin:0;font-size:16px}
.h-list{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:60px}
.h-row{padding:9px 11px;border-radius:12px;background:var(--soft);cursor:pointer;text-align:right}
.h-row:hover{outline:1px solid var(--acc)}
.h-e{color:var(--muted);font-size:13.5px;word-break:break-all}
.h-r{font-weight:700;font-size:18px;word-break:break-all;font-variant-numeric:tabular-nums}
.h-meta{display:flex;align-items:center;gap:5px;margin-top:2px}
/* luas & volume */
.main.v-geo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.geo-l{display:flex;flex-direction:column;gap:12px;min-width:0}
.seg2{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--soft);padding:5px;border-radius:14px}
.seg2 button{border:0;background:none;padding:9px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg2 button.on{background:var(--card);box-shadow:var(--shadow);color:var(--acc)}
.seg2.sm{padding:3px;border-radius:11px}.seg2.sm button{padding:6px;font-size:13.5px}
.shape-pick{display:flex;gap:8px}
.shape-pick select{flex:1;font-size:16px;padding:10px 12px;font-weight:600}
.shape-pick .btn.on{border-color:var(--acc);color:var(--acc)}
.cgs[hidden]{display:none}
.cgs{display:flex;flex-direction:column;gap:8px}
.cg-t{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:4px}
.shp{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 9px;cursor:pointer;font-weight:600;font-size:13px;text-align:left;line-height:1.2}
.shp span{font-size:16px;width:20px;text-align:center;flex:none}
.shp:hover{border-color:var(--acc)}
.shp.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card));color:var(--acc)}
.fcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.f-head h2{margin:0;font-size:19px}
.rumus{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;color:var(--acc);margin-top:4px}
.dg{width:190px;height:auto;flex:none;color:var(--text)}
.dg .f1{fill:color-mix(in srgb,var(--acc) 18%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .f2{fill:color-mix(in srgb,var(--acc) 30%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .f3{fill:color-mix(in srgb,var(--acc) 8%,transparent);stroke:var(--acc);stroke-width:1.6;stroke-linejoin:round}
.dg .hole{fill:var(--card);stroke:var(--acc);stroke-width:1.6}
.dg .ln{fill:none;stroke:var(--acc);stroke-width:1;stroke-dasharray:3 3}
.dg .dim{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.dg text{fill:var(--text);font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.fopt{display:flex;flex-direction:column;gap:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fi{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
.fi.wide{grid-column:1/-1}
.fi i{font-weight:500;font-style:normal}
.fi-in{display:flex;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
.fi-in:focus-within{outline:2px solid color-mix(in srgb,var(--acc) 45%,transparent);border-color:var(--acc)}
.fi-in input{flex:1;border:0;outline:0!important;border-radius:0;font-size:16px;padding:9px 11px;font-variant-numeric:tabular-nums}
.fi-in .u{border:0;border-left:1px solid var(--line);border-radius:0;background:var(--soft);font-size:13px;font-weight:700;padding:0 8px;width:62px;flex:none;outline:0}
.fi-in .u.fixed{display:grid;place-items:center;color:var(--muted)}
.fi.bad .fi-in{border-color:var(--red)}
.ferr{color:var(--red);font-weight:500}
.fi>input{font-size:16px}
.tip{margin:0}
.res-in{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--acc) 10%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);display:flex;flex-direction:column;gap:2px}
.res-in.empty{background:var(--soft);border-color:var(--line)}
.res-f{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-word}
.res-big{font-size:30px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.2}
.res-big small{font-size:17px}
.f-act{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.f-act .btn{padding:11px}
.geo-r{padding:16px;display:flex;flex-direction:column;gap:12px;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.doc-h{display:flex;gap:10px;align-items:flex-end}
.doc-name{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.doc-name input{font-size:17px;font-weight:700;padding:9px 12px}
.doc-act{display:flex;gap:6px}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot>div{background:var(--soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.tot span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tot b{font-size:22px;font-variant-numeric:tabular-nums}
.tot small{color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:6px}
.ln{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.ln.editing{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.ln-i{width:24px;height:24px;border-radius:7px;background:var(--soft);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.ln-m{min-width:0;cursor:pointer}
.ln-t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-d{word-break:break-word}
.ln-r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln-r b{font-size:16px}
.ln-r .u{padding:2px 4px;font-size:12px;border-radius:7px}
.ln-a{display:flex;gap:3px}
.recap summary{cursor:pointer;font-weight:600;font-size:14px}
.recap table{width:100%;border-collapse:collapse;margin-top:6px}
.recap td{padding:5px 4px;border-top:1px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* saved data */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dcard{padding:14px;display:flex;flex-direction:column;gap:10px}
.dcard.on{border-color:var(--acc)}
.dc-m{cursor:pointer;display:flex;flex-direction:column;gap:3px}
.dc-n{font-weight:700;font-size:16.5px;word-break:break-word}
.dc-t{display:flex;gap:16px;margin-top:4px;font-variant-numeric:tabular-nums}
.dc-a{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dc-a .btn{padding:5px 4px;font-size:12.5px}
.draft{padding:12px 14px;display:flex;flex-direction:column;cursor:pointer;margin-bottom:12px;border-style:dashed;border-color:var(--acc)}
/* dialogs */
dialog{border:0;padding:0;border-radius:18px;background:var(--card);color:var(--text);width:min(460px,calc(100vw - 24px));box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,8,5,.45)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;word-break:break-word}
.dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:flex;flex-direction:column;gap:8px}
.fld>span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg.two-s{grid-template-columns:1fr 1fr}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;font-weight:600}
.seg input:checked+span{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center}
.toast[hidden]{display:none}
/* gate (same as Planner, orange) */
.gate{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(1100px 700px at 10% 0%,#d9480f 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#b8860b 0%,transparent 55%),linear-gradient(160deg,#2a160b,#120c08)}
.gate-card{width:min(380px,100%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:24px;padding:34px 26px 24px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.gate .logo{width:68px;height:68px;border-radius:20px;font-size:34px;margin:0 auto 12px}
.gate h1{margin:0;font-size:27px}
.gate-sub{margin:4px 0 22px;color:rgba(255,255,255,.75)}
.gate-field{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:4px 14px;text-align:left;margin-bottom:10px}
.gate-field:focus-within{border-color:#ffc9a3;box-shadow:0 0 0 3px rgba(255,201,163,.3)}
.gate-field input{flex:1;background:none;border:0;outline:0!important;color:#fff;font-size:16px;padding:10px 0}
.gate-field input::placeholder{color:rgba(255,255,255,.6)}
.mask-wrap{position:relative;flex:1;display:block;min-width:0}
.mask-wrap input,#user-mask{font:500 17px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;padding:10px 0}
.mask-wrap input{width:100%;-webkit-text-fill-color:transparent;color:transparent;caret-color:#fff}
.mask-wrap input::placeholder{-webkit-text-fill-color:rgba(255,255,255,.6);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:0}
#user-mask{position:absolute;inset:0;pointer-events:none;color:#fff;white-space:pre;overflow:hidden}
.gate-btn{width:100%;margin-top:4px;padding:12px;font-size:16px;font-weight:700;border-radius:14px;background:linear-gradient(135deg,#ff8a3d,#d9480f);border:0;color:#fff;cursor:pointer}
.gate-btn:disabled{opacity:.7}
.gate-err{color:#ffc2c2;min-height:18px;margin-top:10px;font-size:14px}
.gate-note{color:rgba(255,255,255,.65);font-size:12.5px;margin:6px 0 0;line-height:1.5}
.gate .check{justify-content:center;color:rgba(255,255,255,.85);font-weight:500;font-size:14px;margin:4px 0 10px}
/* medium screens: calculator full width, history below */
@media (max-width:1100px){
  .main.v-calc{grid-template-columns:1fr}
  .hist{position:static;max-height:none}
}
/* phones + small tablets */
@media (max-width:820px){
  .top-in{padding:8px 12px;gap:10px}
  .tabs{display:none}
  .top-r{margin-left:auto}
  .main{padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
  .bnav{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;font-weight:600;color:var(--muted);padding:4px;border-radius:10px;cursor:pointer}
  .bnav button span{font-size:20px}
  .bnav button.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent)}
  .calc{padding:10px}
  .screen{margin-bottom:10px}
  .disp{font-size:34px}
  .pads{grid-template-columns:1fr;gap:8px}
  .sci,.basic{gap:6px}
  .key.sk{height:40px;font-size:13.5px;border-radius:10px}
  .basic .key{height:54px}
  .main.v-geo{grid-template-columns:1fr}
  .geo-r{position:static;max-height:none;overflow:visible}
  .dg{width:130px}
  .f-head h2{font-size:17px}
  .ln{grid-template-columns:22px minmax(0,1fr) auto;row-gap:4px}
  .ln-a{grid-column:2/-1;justify-content:flex-end}
  .head-r{min-width:0;flex-basis:100%}
  .head-r input{max-width:none}
  .dgrid{grid-template-columns:1fr}
  .sync{display:none}
}
@media (max-width:420px){
  .fgrid{grid-template-columns:1fr 1fr}
  .doc-h{flex-wrap:wrap}
  .doc-name{flex-basis:100%}

const newDoc = () => ({ name: '', lines: [], created: Date.now() });
const live = kind => [...S.items.values()].filter(i => i.kind === kind && !i.deleted);

function put(it, quiet) { // local write → queue → push
  if (RO()) return;

  S.items.set(key(it), it); S.queue.add(key(it)); saveCache(); if (!quiet) render(); pushSoon();
}

// ---------- current data (draft until saved with a name; saved data autosaves) ----------
const curItem = () => S.curId ? S.items.get(S.admin ? S.curId : S.user + '/' + S.curId) : null;
function cur() { const it = curItem(); if (S.curId && (!it || it.deleted)) { S.curId = null; LS.del(cacheKey() + '.cur'); } return it && !it.deleted ? it.data : S.draft; }
function mutate(fn, quiet) {

function totals(d) {
  const t = { vol: 0, area: 0, nv: 0, na: 0 };
  for (const ln of d.lines || []) { const c = lineCat(ln); if (c === 'vol') { t.vol += ln.tot || 0; t.nv++; } else if (c === 'area') { t.area += ln.tot || 0; t.na++; } }
  return t;
}
const lineCat = ln => ln.sh === 'expr' ? (ln.unit === 'm3' ? 'vol' : ln.unit === 'm2' ? 'area' : '') : SMAP.get(ln.sh)?.cat || '';
const lineUnit = ln => ln.sh === 'expr' ? (ln.unit === 'm3' ? 'm³' : ln.unit === 'm2' ? 'm²' : '') : UNIT_TXT[SMAP.get(ln.sh)?.cat] || '';
function lineDims(ln) {
  if (ln.sh === 'expr') return ln.e;
  const sh = SMAP.get(ln.sh); if (!sh) return '';
  const parts = sh.f.filter(f => String(ln.v?.[f.k] ?? '').trim()).map(f => `${f.k} ${String(ln.v[f.k]).trim()}${f.t === 'len' ? ' ' + (ln.u?.[f.k] || 'm') : f.t === 'area' ? ' m²' : f.t === 'deg' ? '°' : ''}`);
  const o = (sh.opts || []).map(op => ln.o?.[op.k] && ln.o[op.k] !== op.o[0][0] ? op.o.find(x => x[0] === ln.o[op.k])?.[1] : '').filter(Boolean);
  return parts.join(' × ') + (o.length ? ' · ' + o.join(', ') : '');
}

// ---------- form compute ----------
function form(id = S.shape) {
  if (!S.forms[id]) {
    let u = {}; try { u = JSON.parse(LS.get('units.' + id) || '{}'); } catch {}
    const sh = SMAP.get(id), o = {}; for (const op of sh.opts || []) o[op.k] = op.o[0][0];
    S.forms[id] = { v: {}, u, n: '1', lb: '', o };
  }
  return S.forms[id];
}
function compute(sh, fm) { // → {ok, val, tot, f, errs:{k:msg}, msg}
  const v = {}, errs = {}; let missing = false;
  for (const f of sh.f) {
    const raw = fm.v[f.k];
    if (raw == null || !String(raw).trim()) { if (!f.opt) missing = true; continue; }
    try {
      let x = numIn(raw);
      if (x < 0) throw new Error('Tidak boleh negatif');
      if (f.t === 'len') x *= UNITS[fm.u[f.k] || 'm'];
      v[f.k] = x;
    } catch (e) { errs[f.k] = e.message; }
  }
  let n = 1; try { n = String(fm.n ?? '').trim() ? numIn(fm.n) : 1; if (n < 0) throw new Error('Tidak boleh negatif'); } catch (e) { errs.n = e.message; }
  if (Object.keys(errs).length) return { ok: false, errs, msg: 'Periksa isian yang ditandai merah.' };
  if (missing) return { ok: false, errs, msg: '' };
  try {
    const [val, f] = sh.c(v, fm.o || {});
    if (!Number.isFinite(val)) throw new Error('Hasil tidak valid');
    if (val < 0) throw new Error('Hasil negatif — periksa ukuran (mis. bukaan lebih besar dari dinding)');
    return { ok: true, val, n, tot: val * n, f, errs };
  } catch (e) { return { ok: false, errs, msg: e.message }; }
}
function addLine() {
  if (RO()) return;
  const sh = SMAP.get(S.shape), fm = form(), r = compute(sh, fm);
  if (!r.ok) { toast(r.msg || 'Lengkapi semua ukuran dulu.'); const f = sh.f.find(f => !f.opt && !String(fm.v[f.k] ?? '').trim()); if (f) $('#in-' + f.k)?.focus(); return; }
  const ln = { id: S.edit || rid('l'), sh: sh.id, lb: fm.lb.trim(), v: { ...fm.v }, u: { ...fm.u }, o: { ...fm.o }, n: String(fm.n || '1'), r: r.val, tot: r.tot, f: r.f, t: Date.now() };
  const editing = S.edit; S.edit = null; fm.lb = '';
  mutate(d => { const i = d.lines.findIndex(x => x.id === ln.id); if (i >= 0) d.lines[i] = ln; else d.lines.push(ln); });
  toast(editing ? 'Baris diperbarui ✓' : `Ditambahkan: ${R(r.tot)} ${UNIT_TXT[sh.cat]}`);
}

// ---------- server ----------
async function rpc(fn, args) { // retries: some networks drop connections
  for (let i = 0; ; i++) {
    try {
      const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, { method: 'POST', cache: 'no-store', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
      if (!r.ok) { const e = new Error('server ' + r.status); e.server = true; throw e; }
      const t = await r.text(); return t ? JSON.parse(t) : null;
    } catch (e) { if (i >= 4 || e.server) throw navigator.onLine ? e : new Error('offline'); await new Promise(r => setTimeout(r, 300 * (i + 1))); }
  }
}
let pushTimer = null;
function pushSoon() { clearTimeout(pushTimer); pushTimer = setTimeout(syncNow, 400); showSync(); }
async function syncNow() {
  if (!S.user && !S.admin) return;
  if (S.sync.busy) { S.sync.again = true; return; }
  S.sync.busy = true; showSync(); let changed = false; const me = cacheKey();
  try {
    if (!S.admin && S.queue.size) {
      const keys = [...S.queue], sent = keys.map(k => S.items.get(k)).filter(Boolean);
      const snap = new Map(sent.map(i => [key(i), i.updated]));
      for (let i = 0; i < sent.length; i += 200) {
        const b = sent.slice(i, i + 200).map(({ id, kind, data, updated, deleted }) => ({ id, kind, data, updated, deleted }));
        const r = await rpc('cl_put', { p_owner: S.user, p_pin: S.pin || null, p_items: b });
        if (!r?.ok) { needPin(r?.pin); return; }
      }
      for (const k of keys) if (S.items.get(k)?.updated === snap.get(k)) S.queue.delete(k);
      saveCache(); ping();
    }
    let rows;
    if (S.admin) {
      const r = await rpc('cl_admin', { p_pass: S.pass, p_after: S.seq });
      if (!r?.ok) { logout(); return; }
      S.users = r.users || []; LS.set('admin.users', JSON.stringify(S.users)); rows = r.rows || [];
    } else { const r = await rpc('cl_list', { p_owner: S.user, p_after: S.seq, p_pin: S.pin || null }); if (!r?.ok) { needPin(r?.pin); return; } rows = r.rows || []; }
    if (me !== cacheKey()) return;
    for (const r of rows) {
      const it = { id: r.id, owner: r.owner || S.user, kind: r.kind, data: r.data || {}, updated: Number(r.updated), deleted: !!r.deleted };
      const cur = S.items.get(key(it));
      if (!cur || (it.updated >= cur.updated && !S.queue.has(key(it)))) {
        if (!cur || JSON.stringify(cur) !== JSON.stringify(it)) changed = true;
        if (it.deleted && it.kind === 'hist') S.items.delete(key(it)); else S.items.set(key(it), it);
      }
      S.seq = Math.max(S.seq, Number(r.seq));
    }
    if (changed || rows.length) saveCache();
    S.sync.at = new Date(); S.sync.err = '';
  } catch (e) { S.sync.err = e?.message === 'offline' ? 'offline — tersimpan di perangkat ini' : (e?.message || String(e)); }
  finally { S.sync.busy = false; }
  if (S.sync.again) { S.sync.again = false; return syncNow(); }

}

let sb = null, chans = [];
async function liveStart() {
  try {
    if (!window.supabase) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    sb ||= window.supabase.createClient(SB_URL, SB_KEY);
    liveStop();
    const all = sb.channel('calc-all');
    if (S.admin) all.on('broadcast', { event: 'chg' }, () => syncNow());
    chans.push(all.subscribe());

}

  const name = S.user; if (!name) return;

async function login(raw, pass, remember, pin) {
  const name = normUser(raw);
  if (!validUser(name)) throw new Error('Nama pengguna 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda minus.');
  if (name === ADMIN) {
    if (!pass) throw new Error('Masukkan password Admin.');
    const r = await rpc('cl_admin', { p_pass: pass, p_after: 0 }).catch(e => { throw new Error('Tidak bisa menghubungi server (' + e.message + ').'); });
    if (!r?.ok) throw new Error(r?.locked ? 'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.' : 'Password Admin salah.');
    S.admin = true; S.user = null; S.pass = pass;
    loadCache(); S.items = new Map(); S.seq = 0; S.users = r.users || [];
    for (const x of r.rows || []) { const it = { id: x.id, owner: x.owner, kind: x.kind, data: x.data || {}, updated: Number(x.updated), deleted: !!x.deleted }; S.items.set(key(it), it); S.seq = Math.max(S.seq, Number(x.seq)); }
    saveCache(); LS.set('admin.users', JSON.stringify(S.users)); S.sync.at = new Date();
    SS.set('admin', pass); if (remember) LS.set('session', JSON.stringify({ admin: true })); else LS.del('session');
    S.view = 'data';
  } else {
    let r = null;
    try { r = await rpc('pl_login', { p_owner: name, p_pin: pin || null }); } catch (e) { // offline: unlock with the PIN checked on this device before
      const h = LS.get('u.' + name + '.pinhash');
      if (h) { if (!pin) { const er = new Error(PIN_MSG.need); er.needPin = true; throw er; } if (await pinHash(name, pin) !== h) throw new Error(PIN_MSG.wrong); }
      else if (LS.get('u.' + name + '.haspin')) throw new Error('Tidak bisa menghubungi server (' + e.message + ').');
    }
    if (r && !r.ok) { const er = new Error(PIN_MSG[r.pin] || 'Gagal masuk.'); er.needPin = r.pin === 'need'; throw er; }
    S.admin = false; S.user = name; S.pass = ''; S.pin = pin || ''; S.gate = null;
    if (r) { S.hasPin = !!r.pin; if (r.pin) { LS.set('u.' + name + '.haspin', '1'); LS.set('u.' + name + '.pinhash', await pinHash(name, pin)); } else { LS.del('u.' + name + '.haspin'); LS.del('u.' + name + '.pinhash'); } }
    else S.hasPin = !!pin;
    if (pin) SS.set('pin.' + name, pin);
    loadCache();
    if (remember) LS.set('session', JSON.stringify({ user: name })); else { LS.del('session'); SS.set('user', name); }
    setTimeout(syncNow, 0);
  }
  liveStart();
}

  S.user = null; S.admin = false; S.pass = ''; S.items = new Map(); S.queue = new Set(); S.seq = 0; S.curId = null; S.sync = { busy: false, again: false, at: null, err: '' };

}
function lineRow(ln, i, ro) {

  return `<div class="ln${S.edit === ln.id ? ' editing' : ''}">

    </div>
    <div class="ln-r"><b>${ln.sh === 'expr' ? esc(N(ln.tot, 6)) : R(ln.tot)}</b> ${ln.sh === 'expr' && !ro ? `<select class="u" data-lu="${esc(ln.id)}" aria-label="Satuan"><option value=""${!ln.unit ? ' selected' : ''}>—</option><option value="m3"${ln.unit === 'm3' ? ' selected' : ''}>m³</option><option value="m2"${ln.unit === 'm2' ? ' selected' : ''}>m²</option></select>` : `<small>${u}</small>`}</div>
    ${ro ? '' : `<div class="ln-a"><button type="button" class="btn xs" data-a="editline" data-v="${esc(ln.id)}" title="Ubah">✎</button><button type="button" class="btn xs" data-a="dupline" data-v="${esc(ln.id)}" title="Duplikat">⧉</button><button type="button" class="btn xs" data-a="delline" data-v="${esc(ln.id)}" title="Hapus">✕</button></div>`}

function recap(d) {
  const g = new Map();
  for (const ln of d.lines || []) { const c = lineCat(ln); if (!c) continue; const k = ln.sh === 'expr' ? 'expr-' + c : ln.sh; const x = g.get(k) || { n: ln.sh === 'expr' ? 'Kalkulator' : SMAP.get(ln.sh)?.n, c, v: 0, cnt: 0 }; x.v += ln.tot || 0; x.cnt++; g.set(k, x); }
  if (g.size < 2) return '';
  return `<details class="recap"><summary>Rekap per jenis (${g.size})</summary><table>${[...g.values()].sort((a, b) => a.c.localeCompare(b.c) || b.v - a.v).map(x => `<tr><td>${esc(x.n)} <span class="muted small">${x.cnt} item</span></td><td class="num">${R(x.v)} ${UNIT_TXT[x.c]}</td></tr>`).join('')}</table></details>`;
}

function docText(d) {
  const t = totals(d), rows = (d.lines || []).map((ln, i) => `${i + 1}. ${ln.lb ? ln.lb + ' — ' : ''}${ln.sh === 'expr' ? 'Kalkulator' : SMAP.get(ln.sh)?.n}: ${lineDims(ln)}${Number(ln.n) !== 1 ? ' × ' + ln.n + ' bh' : ''} = ${ln.sh === 'expr' ? N(ln.tot, 6) : R(ln.tot)} ${lineUnit(ln)}`);
  return `${d.name || 'Data perhitungan'}\n${rows.join('\n')}\n\nTotal volume: ${R(t.vol)} m³\nTotal luas: ${R(t.area)} m²`;
}
function docCsv(d) {
  const sep = loc() === 'id-ID' ? ';' : ',', q = s => `"${String(s ?? '').replace(/"/g, '""')}"`;
  const num = x => Number.isFinite(x) ? x.toLocaleString(loc(), { useGrouping: false, maximumFractionDigits: 6 }) : '';
  const rows = [['No', 'Nama item', 'Jenis', 'Ukuran', 'Rumus', 'Hasil per bh', 'Jumlah', 'Total', 'Satuan']];
  (d.lines || []).forEach((ln, i) => rows.push([i + 1, ln.lb, ln.sh === 'expr' ? 'Kalkulator' : SMAP.get(ln.sh)?.n, lineDims(ln), ln.f || ln.e, num(ln.r), ln.n, num(ln.tot), lineUnit(ln)]));
  const t = totals(d); rows.push([], ['', '', '', '', '', '', 'Total volume', num(t.vol), 'm³'], ['', '', '', '', '', '', 'Total luas', num(t.area), 'm²']);
  return '﻿' + rows.map(r => r.map(q).join(sep)).join('\r\n');
}
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

  copydoc: () => copyText(docText(cur())),
  csvdoc: () => { const d = cur(); download((d.name || 'data-perhitungan').replace(/[^\w\- .]+/g, '_') + '.csv', docCsv(d), 'text/csv;charset=utf-8'); },
  clearlines: el => sure(el, '⚠ Yakin? Klik lagi', () => { mutate(d => { d.lines = []; }); dlg().close(); }),
  rename: el => openRename(el.dataset.v),
  dupdoc: el => {
    const it = S.items.get(el.dataset.v); if (!it) return;
    const id = rid('d_'); put({ id, owner: S.user, kind: 'data', deleted: false, data: { ...clone(it.data), name: (it.data.name || 'Data') + ' (salinan)', created: Date.now() } }, true);
    if (dlg().open) dlg().close(); render(); toast('Duplikat dibuat ✓');
  },
  deldoc: el => sure(el, '⚠ Hapus? Klik lagi', () => {
    const it = S.items.get(el.dataset.v); if (!it) return;
    put({ ...it, deleted: true }, true); if (S.curId === it.id) { S.curId = null; LS.del(cacheKey() + '.cur'); }
    if (dlg().open) dlg().close(); render(); toast('Data dihapus.');
  }),
  pinsave: () => {
    const old = $('#pin-old')?.value || '', a = $('#pin-new').value, b = $('#pin-new2').value, out = $('#pin-msg');
    if (!/^\d{4,12}$/.test(a)) { out.textContent = PIN_MSG.format; return; }
    if (a !== b) { out.textContent = 'PIN baru tidak sama.'; return; }
    if (S.hasPin && !old) { out.textContent = 'Masukkan PIN saat ini.'; return; }
    pinChange(old, a, out);
  },
  pinoff: () => { const old = $('#pin-old')?.value || '', out = $('#pin-msg'); if (!old) { out.textContent = 'Masukkan PIN saat ini untuk menghapus.'; return; } pinChange(old, '', out); }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || !A[el.dataset.a] || el.disabled) return;
  if (ev.target.closest('select') && !el.matches('select')) return; // unit select inside a clickable row
  ev.preventDefault(); ev.stopPropagation(); A[el.dataset.a](el);
});
// keypad buttons must not steal focus/caret from the display
document.addEventListener('pointerdown', ev => { if (ev.target.closest('.key')) ev.preventDefault(); });
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'user-in') syncMask();
  if (t.dataset.u) unitChange(t);
  if (t.id === 'disp') { S.expr = t.value; S.justEval = false; S.err = ''; S.caret = [t.selectionStart, t.selectionEnd]; updPreview(); }
  if (t.id === 'calc-q') { S.calcQ = t.value; render(); }
  if (t.id === 'data-q') { S.q = t.value; render(); }
  if (t.dataset.f) {
    const fm = form(); if (t.dataset.f === 'n') fm.n = t.value; else if (t.dataset.f === 'lb') { fm.lb = t.value; return; } else fm.v[t.dataset.f] = t.value;
    const sh = SMAP.get(S.shape), r = compute(sh, fm), box = $('#geo-res'); if (box) box.innerHTML = resBox(sh, r);
    const lab = t.closest('.fi'), err = r.errs?.[t.dataset.f]; lab?.classList.toggle('bad', !!err);
    let sm = lab?.querySelector('.ferr'); if (err) { if (!sm) { sm = document.createElement('small'); sm.className = 'ferr'; lab.appendChild(sm); } sm.textContent = err; } else sm?.remove();
  }
  if (t.id === 'doc-name') { const v = t.value; mutate(d => { d.name = v; }, true); }
});
function unitChange(t) { const fm = form(); fm.u[t.dataset.u] = t.value; LS.set('units.' + S.shape, JSON.stringify(fm.u)); const sh = SMAP.get(S.shape); const box = $('#geo-res'); if (box) box.innerHTML = resBox(sh, compute(sh, fm)); }
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.u) unitChange(t);
  if (t.name === 'theme') { t.value === 'auto' ? LS.del('theme') : LS.set('theme', t.value); applyTheme(); }
  if (t.name === 'dec') { t.value === 'id' ? LS.del('dec') : LS.set('dec', t.value); render(); }
  if (t.id === 'shape-sel') { S.shape = t.value; LS.set('shape', S.shape); S.edit = null; render(); }
  if (t.dataset.lu) { const id = t.dataset.lu, v = t.value; mutate(d => { const ln = d.lines.find(l => l.id === id); if (ln) ln.unit = v; }); }
});
document.addEventListener('keyup', ev => { if (ev.target.id === 'disp') S.caret = [ev.target.selectionStart, ev.target.selectionEnd]; });
document.addEventListener('selectionchange', () => { const d = disp(); if (d && document.activeElement === d) S.caret = [d.selectionStart, d.selectionEnd]; });
document.addEventListener('keydown', ev => {
  if (dlg().open || ev.metaKey || ev.ctrlKey || ev.altKey || S.view !== 'calc' || (!S.user && !S.admin)) return;
  const t = ev.target, inDisp = t.id === 'disp', typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) && !inDisp;
  if (typing) return;
  if (ev.key === 'Enter' || (ev.key === '=' )) { ev.preventDefault(); equals(); return; }
  if (ev.key === 'Escape') { ev.preventDefault(); keyAct('@ac'); return; }
  if (inDisp) { if (S.justEval && ev.key.length === 1) { // typing after "=": digits start fresh, operators continue
      if (/[\d.(]/.test(ev.key)) { ev.preventDefault(); ins(ev.key); } else S.justEval = false; } return; }
  if (ev.key === 'Backspace') { ev.preventDefault(); back(); return; }
  const map = { '*': '×', '/': '÷', '-': '−', 'x': '×' };
  if (/^[\d.+\-*/^()!%,]$|^x$/.test(ev.key)) { ev.preventDefault(); ins(map[ev.key] || ev.key); }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.id === 'geo-form') { addLine(); return; }
  if (f.id === 'rename-form') { const it = S.items.get(f.dataset.k), v = $('#rename-in').value.trim(); if (it && v) put({ ...it, data: { ...it.data, name: v } }); dlg().close(); return; }
  if (f.id === 'gate-form') {
    const btn = f.querySelector('button'); btn.disabled = true; btn.textContent = 'Membuka…';
    const pinMode = !!S.gate, name = pinMode ? S.gate.name : $('#user-in').value, pin = pinMode ? $('#pin-in').value : '';
    if (pinMode && !pin) { btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = PIN_MSG.need; return; }
    login(name, pinMode ? '' : $('#pass-in').value, $('#remember').checked, pin).then(render, e => {
      if (e.needPin && !pinMode) { S.gate = { name: normUser(name), msg: '' }; render(); return; }
      btn.disabled = false; btn.textContent = 'Masuk'; $('#gate-err').textContent = e.message; const pi = $('#pin-in'); if (pi) { pi.value = ''; pi.focus(); } });
  }
});
dlg().addEventListener('click', ev => { if (ev.target === dlg()) dlg().close(); }); // click on backdrop

// ---------- auto update + boot ----------
async function checkUpdate() { // phones keep old copies; load the newer build
  if (dlg().open || S.queue.size) return;
  try {
    const r = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' }); const m = /const BUILD = '([^']+)'/.exec(await r.text());
    if (m && m[1] !== BUILD && m[1] !== '__BUILD__' && SS.get('reloaded') !== m[1]) { SS.set('reloaded', m[1]); location.replace(location.pathname + '?v=' + m[1] + location.hash); }
  } catch {}
}
setInterval(() => { if (!document.hidden) syncNow(); }, 10000);
setInterval(checkUpdate, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNow(); });
window.addEventListener('online', () => syncNow());
window.addEventListener('focus', () => syncNow());

function boot() {
  applyTheme(); checkUpdate();
  let s = null; try { s = JSON.parse(LS.get('session') || 'null'); } catch {}
  const ssUser = SS.get('user'), ssAdmin = SS.get('admin');
  if (s?.admin || ssAdmin) {
    if (ssAdmin) { S.admin = true; S.pass = ssAdmin; loadCache(); render(); liveStart(); syncNow(); return; }
    LS.del('session'); // admin password is never stored on the device; ask again
  } else if (s?.user || ssUser) {
    const name = s?.user || ssUser, pin = SS.get('pin.' + name) || '';
    if (LS.get('u.' + name + '.haspin') && !pin) { S.gate = { name, msg: '' }; render(); return; } // PIN asked on every new visit
    S.user = name; S.pin = pin; S.hasPin = !!LS.get('u.' + name + '.haspin'); loadCache();
    render(); liveStart(); syncNow(); return;
  }
  render();
}
boot();
</script>
